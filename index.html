<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Yusuf | 3D Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            overflow: hidden;
            background-color: #0d1117;
            color: #ffffff;
        }

        #webgl {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            outline: none;
            z-index: 1;
        }

        .top-header {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            background: rgba(22, 27, 34, 0.7);
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .top-header h2 {
            font-size: 18px;
            color: #38bdf8;
        }

        .top-header p {
            font-size: 11px;
            color: #8b949e;
        }

        .bottom-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 90%;
            max-width: 800px;
            background: rgba(22, 27, 34, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #818cf8;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .projects-grid {
            display: flex;
            gap: 10px;
        }

        .project-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .project-card:hover {
            transform: translateY(-2px);
            border-color: #38bdf8;
        }

        .project-card h4 {
            font-size: 13px;
            color: #f0f6fc;
            margin-bottom: 4px;
        }

        .project-card p {
            font-size: 11px;
            color: #8b949e;
            line-height: 1.3;
        }

        @media (max-width: 600px) {
            .projects-grid {
                flex-direction: column;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <canvas id="webgl"></canvas>

    <div class="top-header">
        <h2>Muhammad Yusuf</h2>
        <p>Junior AI & Web Developer</p>
    </div>

    <div class="bottom-panel">
        <div class="section-title">🚀 Loyihalarim</div>
        <div class="projects-grid">
            <div class="project-card">
                <h4>🤖 AI Ustoz & Do'st</h4>
                <p>Gemini API va Node.js orqali ishlaydigan sun'iy intellekt suhbatdoshi va o'quv yordamchisi.</p>
            </div>
            <div class="project-card">
                <h4>📊 3D Interaktiv Portfolio</h4>
                <p>Three.js yordamida yaratilgan virtual xona va web-rezyume interfeysi.</p>
            </div>
        </div>
    </div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0c10);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3.5, 3, 4.5);

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('webgl'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // --- YORUG'LIK (LIGHTS) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        // Neon chiroqlar (Stol usti va xona nuri)
        const blueLight = new THREE.PointLight(0x38bdf8, 2, 8);
        blueLight.position.set(0, 2, -0.2);
        scene.add(blueLight);

        const purpleLight = new THREE.PointLight(0xa855f7, 1.5, 8);
        purpleLight.position.set(-2, 2, -2);
        scene.add(purpleLight);

        // --- XONA DASTURLASH (ROOM GEOMETRY) ---
        // Pol
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(5, 5),
            new THREE.MeshStandardMaterial({ color: 0x161b22, roughness: 0.8 })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Chap devor
        const leftWall = new THREE.Mesh(
            new THREE.PlaneGeometry(5, 4),
            new THREE.MeshStandardMaterial({ color: 0x0f172a, side: THREE.DoubleSide })
        );
        leftWall.position.set(-2.5, 2, 0);
        leftWall.rotation.y = Math.PI / 2;
        scene.add(leftWall);

        // Orqa devor
        const backWall = new THREE.Mesh(
            new THREE.PlaneGeometry(5, 4),
            new THREE.MeshStandardMaterial({ color: 0x0f172a, side: THREE.DoubleSide })
        );
        backWall.position.set(0, 2, -2.5);
        scene.add(backWall);

        // --- MEBELLAR VA PRORIBLAR ---
        // Stol
        const desk = new THREE.Mesh(
            new THREE.BoxGeometry(2.2, 0.08, 1.1),
            new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3 })
        );
        desk.position.set(0, 1, -0.8);
        scene.add(desk);

        // Stol oyoqlari
        const legMat = new THREE.MeshStandardMaterial({ color: 0x020617 });
        const legGeo = new THREE.CylinderGeometry(0.03, 0.03, 1);
        [[-0.9, 0.5, -1.2], [0.9, 0.5, -1.2], [-0.9, 0.5, -0.4], [0.9, 0.5, -0.4]].forEach(pos => {
            const leg = new THREE.Mesh(legGeo, legMat);
            leg.position.set(...pos);
            scene.add(leg);
        });

        // Monitor va uning nuri (Ekranda kod simulyatsiyasi)
        const monitorGroup = new THREE.Group();
        const monitorFrame = new THREE.Mesh(
            new THREE.BoxGeometry(1, 0.6, 0.04),
            new THREE.MeshStandardMaterial({ color: 0x0f172a })
        );
        const monitorScreen = new THREE.Mesh(
            new THREE.PlaneGeometry(0.92, 0.52),
            new THREE.MeshBasicMaterial({ color: 0x0284c7 }) // Yoritilgan ekran
        );
        monitorScreen.position.z = 0.025;
        monitorGroup.add(monitorFrame, monitorScreen);
        monitorGroup.position.set(0, 1.4, -1);
        scene.add(monitorGroup);

        // Monitor ustidagi stend
        const stand = new THREE.Mesh(
            new THREE.CylinderGeometry(0.03, 0.08, 0.3),
            legMat
        );
        stand.position.set(0, 1.15, -1);
        scene.add(stand);

        // Dasturchi Stuli (Chair)
        const chairGroup = new THREE.Group();
        const seat = new THREE.Mesh(
            new THREE.CylinderGeometry(0.35, 0.35, 0.08, 16),
            new THREE.MeshStandardMaterial({ color: 0x3b82f6 })
        );
        seat.position.y = 0.5;

        const backrest = new THREE.Mesh(
            new THREE.BoxGeometry(0.6, 0.6, 0.06),
            new THREE.MeshStandardMaterial({ color: 0x3b82f6 })
        );
        backrest.position.set(0, 0.85, 0.3);

        const chairLeg = new THREE.Mesh(
            new THREE.CylinderGeometry(0.04, 0.04, 0.5),
            legMat
        );
        chairLeg.position.y = 0.25;

        chairGroup.add(seat, backrest, chairLeg);
        chairGroup.position.set(0, 0, 0.1);
        scene.add(chairGroup);

        // Oyna o'lchami o'zgarganda
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
